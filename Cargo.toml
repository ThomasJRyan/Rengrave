[workspace]
members = [
    "crates/rengrave-potrace",
    "crates/rengrave-core",
    "crates/rengrave-cli",
    "crates/rengrave-ui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://example.invalid/rengrave"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
clipper2 = { version = "0.6.0", default-features = false }
eframe = { version = "0.34.3", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.34.3", default-features = false, features = ["callstack"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "pnm", "tiff"] }
rayon = "1.10"
rfd = { version = "0.15.4", default-features = false, features = ["xdg-portal", "async-std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ttf-parser = "0.25.1"
rengrave-potrace = { path = "crates/rengrave-potrace" }
